<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI CAD — 工业厂房设计助手</title>
<style>
:root {
  --bg: #141517;
  --pn: #1E1F23;
  --sb: #1A1B1E;
  --tx: #E5E5EA;
  --t2: #98989E;
  --t3: #636368;
  --br: #4F6EF7;
  --bd: #2C2D31;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg); color: var(--tx);
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh;
}
.container { text-align: center; max-width: 600px; padding: 40px; }
.logo { margin-bottom: 32px; }
.logo svg { width: 72px; height: 72px; }
h1 { font-size: 28px; font-weight: 600; margin-bottom: 8px; }
.sub { color: var(--t2); font-size: 15px; margin-bottom: 40px; }

.cards { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
.card {
  background: var(--pn); border: 1px solid var(--bd); border-radius: 10px;
  padding: 28px 24px; width: 240px; text-decoration: none; color: var(--tx);
  transition: border-color .2s, transform .15s; text-align: left;
}
.card:hover { border-color: var(--br); transform: translateY(-2px); }
.card-icon { font-size: 28px; margin-bottom: 12px; }
.card h3 { font-size: 16px; margin-bottom: 6px; }
.card p { font-size: 13px; color: var(--t2); line-height: 1.5; }

.footer { margin-top: 48px; color: var(--t3); font-size: 12px; }
.footer a { color: var(--t2); text-decoration: none; }
.footer span { margin: 0 8px; }
</style>
</head>
<body>
<div class="container">
  <div class="logo">
    <svg viewBox="0 0 72 72" fill="none">
      <rect x="6" y="6" width="60" height="60" rx="14" stroke="url(#g)" stroke-width="2.5"/>
      <path d="M20 36h32M36 20v32M16 20l8 8M48 52l8 8M16 52l8-8M48 20l8 8" stroke="url(#g)" stroke-width="2" stroke-linecap="round"/>
      <defs><linearGradient id="g" x1="6" y1="6" x2="66" y2="66"><stop stop-color="#4F6EF7"/><stop offset="1" stop-color="#7B8CFF"/></linearGradient></defs>
    </svg>
  </div>
  <h1>AI CAD 设计助手</h1>
  <p class="sub">工业厂房智能设计平台 — 自然语言驱动 AutoCAD 出图</p>

  <div class="cards">
    <a href="/admin" class="card">
      <div class="card-icon">⚙️</div>
      <h3>管理后台</h3>
      <p>用户管理、设计边界、大模型配置、服务器设置</p>
    </a>
    <a href="/docs" class="card">
      <div class="card-icon">📖</div>
      <h3>API 文档</h3>
      <p>Swagger 接口文档，在线调试所有 API</p>
    </a>
    <a href="/api/health" class="card">
      <div class="card-icon">💚</div>
      <h3>服务状态</h3>
      <p>检查服务端健康状态与版本信息</p>
    </a>
  </div>

  <div class="footer">
    <span>AI CAD v1.0</span>
    <span>·</span>
    <a href="/docs">API</a>
    <span>·</span>
    <span id="status">检查中…</span>
  </div>
</div>
<script>
fetch('/api/health').then(r => r.json()).then(d => {
  document.getElementById('status').textContent = '服务正常 v' + d.version;
  document.getElementById('status').style.color = '#4CAF50';
}).catch(() => {
  document.getElementById('status').textContent = '服务异常';
  document.getElementById('status').style.color = '#FF5252';
});
</script>
</body>
</html>

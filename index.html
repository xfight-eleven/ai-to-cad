<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI CAD — 工业厂房设计助手</title>
<style>
:root {
  --bg: #141517; --pn: #1E1F23; --sb: #1A1B1E;
  --tx: #E5E5EA; --t2: #98989E; --t3: #636368;
  --br: #4F6EF7; --bd: #2C2D31; --ok: #4CAF50; --er: #FF5252;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg); color: var(--tx); font-size: 14px;
  display: flex; flex-direction: column; min-height: 100vh;
}
a { color: var(--br); text-decoration: none; }

.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px; height: 52px; background: var(--sb); border-bottom: 1px solid var(--bd);
}
.topbar-left { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; }
.topbar-left svg { width: 24px; height: 24px; }
.status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--t2); }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }

.main {
  flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px;
}
.cards { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 700px; }
.card {
  background: var(--pn); border: 1px solid var(--bd); border-radius: 10px;
  padding: 28px 24px; width: 260px; color: var(--tx);
  transition: border-color .2s, transform .15s; cursor: pointer;
}
.card:hover { border-color: var(--br); transform: translateY(-2px); }
.card-icon { font-size: 28px; margin-bottom: 12px; }
.card h3 { font-size: 16px; margin-bottom: 6px; }
.card p { font-size: 13px; color: var(--t2); line-height: 1.5; }

.footer {
  padding: 16px 24px; text-align: center; color: var(--t3); font-size: 12px;
  border-top: 1px solid var(--bd);
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <svg viewBox="0 0 28 28" fill="none">
      <rect x="2" y="2" width="24" height="24" rx="6" stroke="url(#g)" stroke-width="2"/>
      <path d="M8 14h12M14 8v12" stroke="url(#g)" stroke-width="1.5" stroke-linecap="round"/>
      <defs><linearGradient id="g" x1="2" y1="2" x2="26" y2="26"><stop stop-color="#4F6EF7"/><stop offset="1" stop-color="#7B8CFF"/></linearGradient></defs>
    </svg>
    AI CAD 设计助手
  </div>
  <div class="status">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">检查中…</span>
  </div>
</div>

<div class="main">
  <div class="cards">
    <a href="/admin" class="card">
      <div class="card-icon">⚙️</div>
      <h3>管理后台</h3>
      <p>用户管理、设计边界模板、大模型配置、服务器设置</p>
    </a>
    <a href="/docs" class="card">
      <div class="card-icon">📖</div>
      <h3>API 文档</h3>
      <p>Swagger 接口文档，在线调试所有 API 接口</p>
    </a>
  </div>
</div>

<div class="footer">
  AI CAD v1.0 &nbsp;·&nbsp; C/S 架构 &nbsp;·&nbsp; 设计师请使用桌面客户端
</div>

<script>
fetch('/api/health').then(r => r.json()).then(d => {
  document.getElementById('statusDot').style.background = '#4CAF50';
  document.getElementById('statusText').textContent = '服务正常 · v' + d.version;
}).catch(() => {
  document.getElementById('statusDot').style.background = '#FF5252';
  document.getElementById('statusText').textContent = '服务异常';
});
</script>
</body>
</html>

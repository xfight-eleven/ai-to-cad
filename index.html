<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI CAD — 工业厂房设计助手</title>
<style>
:root {
  --bg: #141517;
  --pn: #1E1F23;
  --sb: #1A1B1E;
  --in: #25262B;
  --tx: #E5E5EA;
  --t2: #98989E;
  --t3: #636368;
  --br: #4F6EF7;
  --bd: #2C2D31;
  --er: #FF5252;
  --ok: #4CAF50;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg); color: var(--tx); font-size:14px;
}
a { color: var(--br); text-decoration:none; }

/* Top Bar */
.topbar {
  display:flex; align-items:center; justify-content:space-between;
  padding:0 24px; height:52px; background:var(--sb);
  border-bottom:1px solid var(--bd);
}
.topbar-left { display:flex; align-items:center; gap:10px; font-size:15px; font-weight:600; }
.topbar-left svg { width:24px; height:24px; }
.topbar-right { display:flex; align-items:center; gap:16px; }
.btn-admin {
  padding:6px 16px; background:var(--br); color:#fff; border:none;
  border-radius:5px; font-size:12px; font-weight:600; cursor:pointer;
}
.btn-admin:hover { opacity:.9; }
.status { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--t2); }
.status-dot { width:8px; height:8px; border-radius:50%; background:var(--ok); }
.user-info { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--t2); }
.btn-logout { padding:4px 12px; border:1px solid var(--bd); background:none; color:var(--t2); border-radius:4px; font-size:11px; cursor:pointer; }
.btn-logout:hover { color:var(--er); border-color:var(--er); }

/* Login */
.login-wrap {
  display:flex; align-items:center; justify-content:center; min-height:calc(100vh - 52px);
}
.login-box {
  background:var(--pn); padding:40px; border-radius:12px; width:400px;
  border:1px solid var(--bd); text-align:center;
}
.login-box h1 { font-size:22px; margin-bottom:4px; }
.login-box .sub { color:var(--t2); font-size:14px; margin-bottom:28px; }
.login-box label { display:block; text-align:left; font-size:13px; color:var(--t2); margin-bottom:6px; }
.login-box input {
  width:100%; background:var(--in); border:1px solid var(--bd); color:var(--tx);
  padding:10px 12px; border-radius:6px; font-size:14px; margin-bottom:16px;
}
.login-box input:focus { outline:none; border-color:var(--br); }
.login-box button {
  width:100%; background:var(--br); color:#fff; border:none; padding:12px;
  border-radius:6px; font-size:15px; font-weight:600; cursor:pointer;
}
.login-err { color:var(--er); font-size:13px; margin-bottom:12px; min-height:20px; }

/* Main Content */
.main { padding:48px; display:flex; justify-content:center; }
.main-inner { max-width:800px; width:100%; }
.main-inner h2 { font-size:20px; margin-bottom:8px; }
.main-inner .welcome { color:var(--t2); font-size:14px; margin-bottom:32px; line-height:1.6; }

.cards { display:flex; gap:16px; flex-wrap:wrap; }
.card {
  background:var(--pn); border:1px solid var(--bd); border-radius:10px;
  padding:24px 20px; flex:1; min-width:200px; color:var(--tx);
  transition:border-color .2s,transform .15s; cursor:pointer;
}
.card:hover { border-color:var(--br); transform:translateY(-2px); }
.card-icon { font-size:24px; margin-bottom:10px; }
.card h3 { font-size:15px; margin-bottom:4px; }
.card p { font-size:13px; color:var(--t2); }

.hidden { display:none !important; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <svg viewBox="0 0 28 28" fill="none">
      <rect x="2" y="2" width="24" height="24" rx="6" stroke="url(#g)" stroke-width="2"/>
      <path d="M8 14h12M14 8v12" stroke="url(#g)" stroke-width="1.5" stroke-linecap="round"/>
      <defs><linearGradient id="g" x1="2" y1="2" x2="26" y2="26"><stop stop-color="#4F6EF7"/><stop offset="1" stop-color="#7B8CFF"/></linearGradient></defs>
    </svg>
    AI CAD 设计助手
  </div>
  <div class="topbar-right" id="topRight">
    <div class="status">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">检查中…</span>
    </div>
    <a href="/docs" style="font-size:12px;color:var(--t2)">API 文档</a>
    <a href="/admin" class="btn-admin hidden" id="btnAdmin">管理后台</a>
    <div class="user-info hidden" id="userInfo">
      <span id="userName"></span>
      <button class="btn-logout" onclick="logout()">退出</button>
    </div>
  </div>
</div>

<!-- 登录 -->
<div id="loginPage" class="login-wrap">
  <div class="login-box">
    <h1>欢迎使用 AI CAD</h1>
    <p class="sub">工业厂房智能设计平台</p>
    <div class="login-err" id="loginErr"></div>
    <label>用户名</label>
    <input type="text" id="loginUser" placeholder="输入用户名" value="admin">
    <label>密码</label>
    <input type="password" id="loginPass" placeholder="输入密码" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">登 录</button>
  </div>
</div>

<!-- 主内容 -->
<div id="mainPage" class="main hidden">
  <div class="main-inner" id="mainContent"></div>
</div>

<script>
const BASE = window.location.origin.replace(/\/+$/, '');
let token = '';

// ── 健康检查 ──
fetch('/api/health').then(r => r.json()).then(d => {
  document.getElementById('statusDot').style.background = '#4CAF50';
  document.getElementById('statusText').textContent = '服务正常 v' + d.version;
}).catch(() => {
  document.getElementById('statusDot').style.background = '#FF5252';
  document.getElementById('statusText').textContent = '服务异常';
});

// ── 登录 ──
async function doLogin() {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value.trim();
  if (!u || !p) return;
  try {
    const resp = await fetch(BASE + '/api/auth/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({username:u, password:p})
    });
    const d = await resp.json();
    if (!resp.ok) throw new Error(d.detail || '登录失败');
    token = d.access_token;
    showMain(d.user);
  } catch(e) {
    document.getElementById('loginErr').textContent = e.message;
  }
}

function showMain(user) {
  document.getElementById('loginPage').classList.add('hidden');
  document.getElementById('mainPage').classList.remove('hidden');
  document.getElementById('userInfo').classList.remove('hidden');
  document.getElementById('userName').textContent = user.display_name;

  const isAdmin = user.role === 'admin';
  if (isAdmin) {
    document.getElementById('btnAdmin').classList.remove('hidden');
  }

  const mc = document.getElementById('mainContent');
  mc.innerHTML = `
    <h2>你好，${user.display_name}</h2>
    <p class="welcome">
      角色：${user.role === 'admin' ? '系统管理员' : '设计师'}<br>
      ${isAdmin
        ? '你可以管理用户账号、设计边界模板、大模型配置和服务器设置。'
        : '请使用 AI CAD 桌面客户端进行设计工作。客户端支持自然语言对话、本地图纸预览和一键推送到 AutoCAD。'
      }
    </p>
    <div class="cards">
      ${isAdmin ? `
      <a href="/admin" class="card">
        <div class="card-icon">⚙️</div>
        <h3>管理后台</h3>
        <p>用户管理、设计边界、大模型配置、服务器设置</p>
      </a>
      ` : ''}
      <a href="/docs" class="card">
        <div class="card-icon">📖</div>
        <h3>API 文档</h3>
        <p>Swagger 接口文档，在线调试所有 API</p>
      </a>
      <div class="card" onclick="copyToken()">
        <div class="card-icon">🔑</div>
        <h3>复制 Token</h3>
        <p>点击复制当前登录凭证，用于 API 调试</p>
      </div>
    </div>`;
}

function logout() {
  token = '';
  document.getElementById('loginPage').classList.remove('hidden');
  document.getElementById('mainPage').classList.add('hidden');
  document.getElementById('userInfo').classList.add('hidden');
  document.getElementById('btnAdmin').classList.add('hidden');
}

function copyToken() {
  navigator.clipboard.writeText(token).then(() => alert('Token 已复制到剪贴板'));
}
</script>
</body>
</html>
